<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CYBER · Neon Royale</title><link rel="stylesheet" href="src/neon/style.css"></head>
<body class="immersive-game"><header><a class="brand" href="./">CYBER<span>SECTOR 7</span></a><button id="profile-open" class="profile-button" aria-label="Open character profile"><img id="profile-thumb" src="assets/character1/portrait.png" alt=""><span>MY PROFILE</span></button><button id="fullscreen-toggle" class="fullscreen-button" aria-label="Enter fullscreen" aria-pressed="false" title="Enter fullscreen">⛶ <span>FULLSCREEN</span></button><div class="wallet"><small>YOUR BALANCE</small><strong id="balance">100 <span>BYTE</span></strong></div><div id="hud-status" aria-label="Player status"></div></header>
<main><section class="world"><div class="world-title"><div><small id="district">SECTOR 7</small><h1 id="place">The city is yours.</h1></div><span class="live">● ONLINE</span></div><div class="canvas-wrap"><canvas id="game" width="768" height="576" tabindex="0" aria-label="Game map. Use arrow keys or WASD to move and E to interact."></canvas><div id="map-loading" hidden>Loading…</div></div><div class="map-footer"><span>WASD / arrows · move &nbsp; E · interact &nbsp; click · walk</span><span id="save-status">Saved in this browser</span></div><nav aria-label="Locations"><button data-go="district_07">⌖ City</button><button data-go="player_home">⌂ My home</button><button data-go="ghost_row_interior">▤ BLACKNET</button><button data-go="neon_royale">♠ Neon Royale</button></nav><div class="mobile-controls" aria-label="Movement"><button data-move="left" aria-label="Move left">←</button><button data-move="up" aria-label="Move up">↑</button><button data-move="down" aria-label="Move down">↓</button><button data-move="right" aria-label="Move right">→</button><button id="interact">Interact</button></div></section>
<button id="actions-toggle" aria-expanded="false" aria-controls="game-actions">⌘ <span>ACTIONS</span></button><aside id="game-actions" hidden><div class="action-heading">LOCAL ACTIONS <button id="actions-close" aria-label="Close actions">×</button></div><div id="activities"></div><div class="character-choice"><label for="character">Your character</label><select id="character"><option value="character1">Shadow Hacker</option><option value="character2">Ghost Netrunner</option><option value="character3">Drone Engineer</option><option value="character4">Corporate Spy</option></select></div><p class="fineprint">BYTE is the game currency. Trading and casino games use virtual funds.</p></aside><p id="message" role="status" aria-live="polite" hidden></p></main>
<dialog id="activity"><div class="dialog-top"><span id="dialog-kicker">NEON ROYALE</span><button id="close" aria-label="Close">✕</button></div><div id="dialog-content"></div></dialog><script type="module" src="src/neon/main.js"></script></body></html>
